<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Wander TV end card</title>
  <!-- Replace the repo line below with your real GitHub URL, then run docs/render-images.ps1 -Names end-card -->
  <defs>
    <style>
      @font-face { font-family: "Young Serif"; src: url("../app/src/main/assets/fonts/YoungSerif-Regular.ttf"); }
      @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; src: url("../app/src/main/assets/fonts/AtkinsonHyperlegible-Regular.ttf"); }
      @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; src: url("../app/src/main/assets/fonts/AtkinsonHyperlegible-Bold.ttf"); }
      .d { font-family: "Young Serif", Georgia, "Times New Roman", serif; }
      .b { font-family: "Atkinson Hyperlegible", "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
    <radialGradient id="glow" cx="300" cy="190" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.34"/>
      <stop offset="0.2" stop-color="#FFB547" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#FF5D8F" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#120E1C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FFF3D6"/>
      <stop offset="0.55" stop-color="#FFD27F"/>
      <stop offset="1" stop-color="#FFB547"/>
    </radialGradient>
    <symbol id="moth" viewBox="-70 -60 140 112" overflow="visible">
      <g id="mothHalf">
        <path d="M-3,-12 C-9,-26 -18,-40 -28,-50" fill="none" stroke="#E9DCC6" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M-6,-20 l-4.5,-0.3 M-9,-26 l-4.5,-0.3 M-12.5,-31.5 l-4.5,-0.3 M-16.5,-37 l-4.2,-0.3 M-20.5,-42 l-3.8,-0.3 M-24.5,-46.5 l-3,-0.3 M-6,-20 l1.4,-4.3 M-9,-26 l1.4,-4.3 M-12.5,-31.5 l1.4,-4.3 M-16.5,-37 l1.3,-4 M-20.5,-42 l1.2,-3.6" stroke="#E9DCC6" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M-3,6 C-14,12 -32,22 -36,34 C-32,44 -16,40 -4,26 Z" fill="#E2D2BA"/>
        <path d="M-4,-8 C-22,-22 -50,-26 -66,-16 C-70,-4 -60,14 -46,28 C-30,24 -14,18 -4,12 Z" fill="#F7EFE2"/>
        <path d="M-12,-6 C-26,-12 -44,-14 -56,-10" fill="none" stroke="#E2D2BA" stroke-width="2" stroke-linecap="round"/>
        <circle cx="-38" cy="2" r="8" fill="#FFB547"/>
        <circle cx="-38" cy="2" r="3.2" fill="#120E1C"/>
      </g>
      <use href="#mothHalf" transform="scale(-1,1)"/>
      <ellipse cx="0" cy="18" rx="7.5" ry="17" fill="#E8A23C"/>
      <path d="M-6.5,12 H6.5 M-7,19 H7 M-6,26 H6" stroke="#B87420" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-3" r="11" fill="#FFC56B"/>
      <g fill="#FFC56B"><circle cx="-9" cy="-9" r="4"/><circle cx="9" cy="-9" r="4"/><circle cx="-11" cy="0" r="4"/><circle cx="11" cy="0" r="4"/></g>
      <circle cx="0" cy="-15" r="7.5" fill="#FFB547"/>
      <circle cx="-3.2" cy="-16" r="2" fill="#120E1C"/>
      <circle cx="3.2" cy="-16" r="2" fill="#120E1C"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="#120E1C"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g fill="#FFD27F">
    <circle cx="420" cy="120" r="2" opacity="0.5"/>
    <circle cx="180" cy="300" r="1.6" opacity="0.4"/>
    <circle cx="520" cy="300" r="1.8" opacity="0.35"/>
    <circle cx="700" cy="90" r="1.4" opacity="0.35"/>
    <circle cx="1100" cy="70" r="1.4" opacity="0.25"/>
    <circle cx="1380" cy="260" r="1.6" opacity="0.25"/>
  </g>

  <!-- the lamp, top left, and the old circle the moth just left -->
  <circle cx="300" cy="190" r="70" fill="#FFB547" opacity="0.14"/>
  <circle cx="300" cy="190" r="28" fill="url(#bulb)"/>
  <path d="M440,206 C430,256 320,272 236,250 C150,226 140,170 210,140 C262,118 352,118 410,148" fill="none" stroke="#F7EFE2" stroke-width="2.2" stroke-dasharray="1.5 11" stroke-linecap="round" opacity="0.45"/>
  <!-- the wander: a curious loop, then off into the night -->
  <path d="M410,148 C470,176 520,240 600,226 C680,212 660,130 730,122 C800,114 790,200 870,196 C960,192 1010,120 1120,110 C1200,103 1250,130 1300,120" fill="none" stroke="#FFB547" stroke-width="2.6" stroke-dasharray="1.5 11" stroke-linecap="round" opacity="0.85"/>
  <use href="#moth" x="-55" y="-45" width="110" height="90" transform="translate(1352 116) rotate(78)"/>

  <text class="d" x="800" y="430" font-size="40" fill="#FFB547" text-anchor="middle">Wander TV</text>
  <text class="d" x="800" y="530" font-size="84" fill="#F7EFE2" text-anchor="middle">Browse together. Wander well.</text>

  <rect x="470" y="590" width="660" height="72" rx="36" fill="#1B1529" stroke="#3A2F57" stroke-width="2"/>
  <text id="repo" class="b" x="800" y="637" font-size="30" font-weight="700" fill="#F7EFE2" text-anchor="middle">github.com/g7dream/wander-tv</text>

  <text class="b" x="800" y="732" font-size="28" fill="#B9AECC" text-anchor="middle">Built for Fire TV  ·  Powered by AWS</text>

  <g>
    <circle cx="752" cy="800" r="8" fill="#FFB547"/>
    <circle cx="784" cy="800" r="8" fill="#FF5D8F"/>
    <circle cx="816" cy="800" r="8" fill="#3DDC97"/>
    <circle cx="848" cy="800" r="8" fill="#5AB4FF"/>
  </g>
</svg>
